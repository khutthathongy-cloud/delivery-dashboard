<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>CPALL Delivery Dashboard V4</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Segoe UI,sans-serif;
background:#f3f5f8;
}

header{
background:#0d3b66;
color:white;
padding:20px;
}

.container{
padding:20px;
}

.toolbar{
background:#fff;
padding:15px;
border-radius:12px;
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

button,input,select{
padding:10px;
border-radius:6px;
border:1px solid #ccc;
}

button{
background:#0d6efd;
color:white;
cursor:pointer;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-bottom:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card h3{
margin:0;
font-size:14px;
color:#666;
}

.card .value{
font-size:30px;
font-weight:bold;
margin-top:10px;
}

.panel{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border:1px solid #ddd;
padding:8px;
}

th{
background:#0d3b66;
color:white;
}
</style>

</head>

<body>

<header>
<h1>CPALL Delivery Dashboard V4</h1>
</header>

<div class="container">

<div class="toolbar">

<input
type="file"
id="dataFile"
accept=".csv,.xlsx,.xls">

<button onclick="importData()">
Import File
</button>

<select
id="storeFilter"
onchange="refreshDashboard()">
<option value="">
ทุกสาขา
</option>
</select>

<button onclick="exportCSV()">
Export CSV
</button>

<button onclick="clearDatabase()">
ล้างข้อมูล
</button>

</div>

<div class="cards">

<div class="card">
<h3>ยอดขายรวม</h3>
<div
class="value"
id="totalSales">0</div>
</div>

<div class="card">
<h3>จำนวนรายการ</h3>
<div
class="value
